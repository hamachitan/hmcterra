name: Checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    name: Tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - uses: denoland/setup-deno@v2
        with:
          cache: true

      - name: Install dependencies
        run: deno ci

      - name: Run tests
        run: deno run test

      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: coverage

  lint:
    runs-on: ubuntu-latest
    name: Deno lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - uses: denoland/setup-deno@v2
        with:
          cache: true

      - name: Install dependencies
        run: deno ci

      - name: Lint
        run: deno lint
